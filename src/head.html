<title>WebBlend Animator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: editor shell — top bar, scene list (left), viewport (center), inspector (right), dope sheet (bottom). Deliberately dark single theme: a 3D tool keeps the frame quiet so the viewport reads. */
:root {
  --bg: #111419;
  --panel: #171b21;
  --panel-2: #1d2229;
  --panel-3: #252b34;
  --line: #2a3039;
  --line-2: #353c48;
  --text: #dbe0e8;
  --muted: #8d96a5;
  --faint: #5e6775;
  --accent: #4aa8ff;
  --accent-ink: #06121f;
  --accent-soft: rgba(74, 168, 255, .14);
  --key: #ffb84a;
  --key-soft: rgba(255, 184, 74, .16);
  --rec: #ff5a5f;
  --ok: #45d39a;
  --warn: #f2c14e;
  --err: #ff6b6b;
  --vp: #2a2f38;
  --f-ui: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-cond: 'Barlow Semi Condensed', 'Barlow', system-ui, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --left-w: 232px;
  --right-w: 300px;
  --tl-h: 220px;
  --top-h: 42px;
  --r: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
::selection { background: var(--accent-soft); }
.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; height: 100%; grid-template-rows: var(--top-h) minmax(0, 1fr) var(--tl-h); grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); grid-template-areas: "top top top" "left vp right" "tl tl tl"; }
.app.no-left { grid-template-columns: 0 minmax(0, 1fr) var(--right-w); }
.app.no-right { grid-template-columns: var(--left-w) minmax(0, 1fr) 0; }
.app.no-left.no-right { grid-template-columns: 0 minmax(0, 1fr) 0; }

/* top bar */
.topbar { grid-area: top; overflow: hidden; display: flex; align-items: center; gap: 6px; padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 30; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-cond); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding-right: 8px; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, var(--key), #ff8a3d); display: grid; place-items: center; color: #1a1205; }
.brand-mark svg { width: 13px; height: 13px; }
.brand small { color: var(--muted); font-weight: 500; letter-spacing: .08em; }
.menus { display: flex; gap: 2px; }
.menu-btn { background: none; border: 0; padding: 6px 9px; border-radius: var(--r); color: var(--text); }
.menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--panel-3); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.spacer { flex: 1; min-width: 4px; }
.tool-group { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; min-width: 28px; padding: 0 7px; background: none; border: 0; border-radius: 6px; color: var(--muted); }
.tbtn:hover { color: var(--text); background: var(--panel-3); }
.tbtn.on { color: var(--accent-ink); background: var(--accent); }
.tbtn.rec.on { background: var(--rec); color: #fff; }
.tbtn.key { color: var(--key); }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn .lbl { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 12px; white-space: nowrap; }
.chip:hover { border-color: var(--faint); }
.chip.ai { border-color: rgba(255, 184, 74, .45); color: var(--key); }
.chip.ai.on { background: var(--key-soft); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.q-dot.low { background: var(--warn); }
.q-dot.potato { background: var(--err); }
.mobile-only { display: none !important; }

/* dropdown menus */
.dropdown { position: fixed; z-index: 100; min-width: 220px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px; box-shadow: 0 12px 32px rgba(0, 0, 0, .45); max-height: calc(100% - 60px); overflow: auto; }
.dd-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border: 0; background: none; border-radius: 5px; text-align: left; color: var(--text); }
.dd-item:hover, .dd-item:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
.dd-item:hover .kbd { color: var(--accent-ink); }
.dd-item:disabled { opacity: .4; }
.dd-item .ico { color: var(--muted); }
.dd-item:hover .ico { color: var(--accent-ink); }
.dd-item .grow { flex: 1; }
.kbd { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.dd-sep { height: 1px; background: var(--line); margin: 4px 6px; }
.dd-label { padding: 6px 10px 2px; font-family: var(--f-cond); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }

/* panels */
.panel { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.panel.left { grid-area: left; border-right: 1px solid var(--line); }
.panel.right { grid-area: right; border-left: 1px solid var(--line); }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); min-height: 38px; }
.panel-title { font-family: var(--f-cond); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; color: var(--muted); flex: 1; }
.panel-body { flex: 1; overflow: auto; min-height: 0; }
.resizer { position: absolute; z-index: 5; background: transparent; }
.resizer:hover, .resizer.drag { background: var(--accent); opacity: .6; }
.resizer.v { top: 0; bottom: 0; width: 5px; cursor: col-resize; }
.panel.left .resizer.v { right: -3px; }
.panel.right .resizer.v { left: -3px; }
.resizer.h { left: 0; right: 0; height: 5px; top: -3px; cursor: row-resize; }

.search { display: flex; align-items: center; gap: 6px; margin: 8px 10px; padding: 0 8px; height: 28px; border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--line); color: var(--faint); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); }

/* outliner */
.outliner { padding: 2px 0 12px; font-size: 12.5px; }
.ol-row { display: flex; align-items: center; gap: 4px; height: 24px; padding-right: 6px; cursor: default; white-space: nowrap; border-left: 2px solid transparent; }
.ol-row:hover { background: var(--panel-2); }
.ol-row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.ol-row.model { font-weight: 500; }
.ol-caret { width: 16px; height: 16px; display: grid; place-items: center; color: var(--faint); background: none; border: 0; padding: 0; flex: none; }
.ol-caret .ico { width: 12px; height: 12px; transition: transform .12s; }
.ol-caret.open .ico { transform: rotate(90deg); }
.ol-caret.empty { visibility: hidden; }
.ol-icon { color: var(--muted); }
.ol-icon.bone { color: #9fb4d0; }
.ol-icon.person { color: var(--key); }
.ol-name { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ol-tr { color: var(--muted); font-size: .92em; }
.ol-badge { font-size: 10.5px; color: var(--faint); font-family: var(--f-mono); }
.ol-eye { background: none; border: 0; color: var(--faint); padding: 2px; display: grid; place-items: center; opacity: 0; }
.ol-row:hover .ol-eye, .ol-eye.off { opacity: 1; }
.ol-eye.off { color: var(--err); }
.ol-more { padding: 4px 10px 4px 40px; color: var(--faint); font-size: 12px; }
.ol-hidden-group { color: var(--faint); font-style: italic; }
.ol-hidden-group .ol-icon { opacity: .7; }
.empty-note { padding: 18px 16px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.empty-note b { color: var(--text); font-weight: 500; }

/* tabs */
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px 9px; border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; font-family: var(--f-cond); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 11.5px; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab.ai-tab.on { border-bottom-color: var(--key); }

/* inspector sections */
.sec { border-bottom: 1px solid var(--line); padding: 10px 14px 12px; }
.sec-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.sec-t { font-family: var(--f-cond); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); flex: 1; }
.sel-head { display: flex; align-items: center; gap: 8px; }
.sel-head .ico { color: var(--accent); }
.sel-head input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 3px 5px; font-size: 14px; font-weight: 500; }
.sel-head input:hover, .sel-head input:focus { border-color: var(--line-2); background: var(--panel-2); outline: none; }
.sub { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.prow { display: grid; grid-template-columns: 62px 1fr 22px; align-items: center; gap: 6px; margin: 4px 0; }
.plabel { color: var(--muted); font-size: 12px; cursor: ew-resize; user-select: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.num { position: relative; display: flex; align-items: center; height: 24px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.num:focus-within { border-color: var(--accent); }
.num i { font-style: normal; font-size: 10px; width: 14px; text-align: center; color: var(--faint); cursor: ew-resize; user-select: none; flex: none; align-self: stretch; display: grid; place-items: center; }
.num i.x { color: #ff7a7a; } .num i.y { color: #7ee08f; } .num i.z { color: #6fb2ff; }
.num input { width: 100%; min-width: 0; background: none; border: 0; outline: none; padding: 0 4px 0 0; font-family: var(--f-mono); font-size: 11.5px; text-align: right; }
.keybtn { width: 22px; height: 22px; display: grid; place-items: center; background: none; border: 0; color: var(--faint); border-radius: 4px; padding: 0; }
.keybtn .ico { width: 13px; height: 13px; }
.keybtn:hover { background: var(--panel-3); color: var(--key); }
.keybtn.animated { color: var(--key); opacity: .65; }
.keybtn.key { color: var(--key); }
.field { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.pose-row label { flex: 0 0 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pose-row input[type=range] { flex: 1; min-width: 0; }
.field > label, .field > .flabel { color: var(--muted); font-size: 12px; width: 76px; flex: none; }
.field input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.field select, .field input[type=text], .field input[type=number], .field input[type=password], .inp { flex: 1; min-width: 0; height: 26px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.field input[type=number].num { flex: 0 0 58px; width: 58px; padding: 0 4px; text-align: right; font-variant-numeric: tabular-nums; }
.field input[type=color] { width: 36px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.val { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 36px; text-align: right; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); background: var(--panel-3); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.amber { background: var(--key); border-color: var(--key); color: #1d1406; font-weight: 500; }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--panel-3); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; }
.toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.hint { color: var(--faint); font-size: 11.5px; line-height: 1.45; margin-top: 6px; }
.hint b { color: var(--muted); font-weight: 500; }
.stat-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; color: var(--muted); }
.stat-grid b { font-family: var(--f-mono); font-weight: 400; color: var(--text); font-size: 11.5px; }

/* clip list */
.clip-row { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 5px 4px 5px 2px; border-radius: 5px; border: 1px solid transparent; }
.clip-row:hover { background: var(--panel-2); }
.clip-row.active { background: var(--key-soft); border-color: rgba(255, 184, 74, .3); }
.clip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; cursor: pointer; }
.clip-meta { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.clip-ctl { grid-column: 3 / 5; display: grid; grid-template-columns: auto 1fr auto 56px 70px; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--muted); }
.clip-ctl input[type=range] { width: 100%; accent-color: var(--key); }
.clip-ctl input, .clip-ctl select { height: 22px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; padding: 0 4px; min-width: 0; }
.ibtn { width: 22px; height: 22px; display: grid; place-items: center; background: none; border: 0; border-radius: 4px; color: var(--faint); padding: 0; }
.ibtn:hover { color: var(--text); background: var(--panel-3); }
.ibtn.on { color: var(--key); }
.ibtn .ico { width: 14px; height: 14px; }
.radio-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--faint); }
.clip-row.active .radio-dot { border-color: var(--key); background: radial-gradient(circle, var(--key) 45%, transparent 50%); }

/* AI */
.ai-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ai-provider { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.ai-provider b { color: var(--text); font-weight: 500; }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.pdot.claude { background: var(--key); }
.pdot.offline { background: var(--ok); }
.ai-log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.msg { max-width: 92%; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; }
.msg.user { align-self: flex-end; background: var(--panel-3); }
.msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }
.msg.bot.err { border-color: rgba(255, 107, 107, .4); }
.msg .msg-actions { display: flex; gap: 6px; margin-top: 6px; }
.msg .thinking { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.ai-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.ai-chip { border: 1px solid var(--line-2); background: none; color: var(--muted); border-radius: 12px; padding: 3px 9px; font-size: 11.5px; }
.ai-chip:hover { color: var(--text); border-color: var(--key); }
.ai-input { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.ai-input textarea { width: 100%; resize: none; height: 64px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 13px; outline: none; }
.ai-input textarea:focus { border-color: var(--key); }
.ai-input .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.ai-input.drop { outline: 2px dashed var(--key); outline-offset: -4px; }
.ai-img-btn { padding: 0 6px; }
.ai-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.ai-thumbs.in-log { margin: 6px 0 0; }
.ai-thumb { position: relative; width: 52px; height: 52px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-2); background: var(--panel-2); }
.ai-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-thumb-x { position: absolute; top: 1px; right: 1px; width: 18px; height: 18px; line-height: 16px; padding: 0; border-radius: 9px; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; cursor: pointer; }
.ai-target { flex: 1; font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* viewport */
.viewport { grid-area: vp; position: relative; background: var(--vp); min-width: 0; min-height: 0; overflow: hidden; }
.viewport-canvas { display: block; position: absolute; inset: 0; touch-action: none; outline: none; }
.vp-tl { position: absolute; top: 10px; left: 12px; display: flex; gap: 6px; align-items: center; z-index: 4; }
.vp-label { font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: rgba(219, 224, 232, .6); background: rgba(17, 20, 25, .45); padding: 4px 8px; border-radius: 4px; }
.vp-tr { position: absolute; top: 10px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }
.vp-tool { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .08); background: rgba(17, 20, 25, .55); color: var(--text); }
.vp-tool:hover { background: rgba(37, 43, 52, .9); }
.vp-tool.on { background: var(--accent); color: #0e1116; border-color: transparent; }
.fly-hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 8px; background: rgba(17, 20, 25, .82); border: 1px solid rgba(255, 255, 255, .1); font-size: 12px; color: rgba(219, 224, 232, .85); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; }
.fly-hud[hidden], .fly-pad[hidden] { display: none; }
.viewport.flying .vp-tl { visibility: hidden; }
.fly-hud .fly-title { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; }
.fly-hud .fly-title svg { width: 14px; height: 14px; }
.fly-hud kbd { font-family: var(--f-mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); }
.fly-hud .fly-speed b { font-family: var(--f-mono); color: var(--text); font-weight: 500; }
.fly-pad { position: absolute; left: 14px; bottom: 14px; z-index: 5; display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.fly-key { border-radius: 10px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(17, 20, 25, .7); color: var(--text); font-size: 16px; touch-action: none; }
.fly-key.down { background: var(--accent); color: #0e1116; }
.fly-key.k-fwd { grid-column: 2; grid-row: 1; } .fly-key.k-left { grid-column: 1; grid-row: 2; } .fly-key.k-back { grid-column: 2; grid-row: 2; } .fly-key.k-right { grid-column: 3; grid-row: 2; }
